name: mac build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./engine
          pip install ./client --no-deps
          pip install wxPython==4.3.2 prismatoid httpx pyinstaller pyobjc-framework-Quartz
      - name: Test
        run: |
          pip install pytest httpx
          pytest engine/tests -q
          pytest client/tests -m "not ui" -q
      - name: Self check
        run: |
          STEADYTYPE_DATA_DIR="$RUNNER_TEMP/st" python client/launcher.py --self-check --no-speech
      - name: Expose the Prism extension
        run: |
          SITE=$(python -c "import pathlib, prism; print(pathlib.Path(prism.__file__).parent)")
          ls "$SITE/_native"
          cp "$SITE"/_native/*prism_cffi* "$SITE"/ || true
          python -c "import prism._prism_cffi as m; print('extension ok', m.__file__)"
      - name: Build
        run: cd client && pyinstaller steadytype.spec --noconfirm
      - name: Package
        run: |
          cd client/dist
          ditto -c -k --sequesterRsrc --keepParent SteadyType.app SteadyType-mac.zip
          ls -lh SteadyType-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SteadyType-mac
          path: client/dist/SteadyType-mac.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" client/dist/SteadyType-mac.zip --clobber
