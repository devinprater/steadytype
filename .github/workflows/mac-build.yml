name: mac build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./engine
          pip install ./client --no-deps
          pip install wxPython==4.3.2 prismatoid httpx pyinstaller
      - name: Test
        run: |
          pip install pytest httpx
          pytest engine -q
          pytest client -m "not ui" -q
      - name: Self check
        run: |
          STEADYTYPE_DATA_DIR="$RUNNER_TEMP/st" python client/launcher.py --self-check --no-speech
      - name: Build
        run: cd client && pyinstaller steadytype.spec --noconfirm
      - name: Package
        run: |
          cd client/dist
          ditto -c -k --sequesterRsrc --keepParent SteadyType.app SteadyType-mac.zip
          ls -lh SteadyType-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SteadyType-mac
          path: client/dist/SteadyType-mac.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" client/dist/SteadyType-mac.zip --clobber
