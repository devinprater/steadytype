repeat: 4
intro: >-
  E sits on the top row, above D. Reach up with your left middle finger and come straight back. Press it, say its name in your head, and return to the home row. A short pause and a shake of the hands every few minutes keeps them loose. Reach up with one finger, then return to the home row.
