kind: keyboarding
end_key: space
repeat: 4
intro: >-
  V is below F. Curl the left index finger down. Press it, say its name in your head, and return to the home row. Slow and even beats fast and jumpy. The bottom row curls your fingers down. Keep your wrists still.
