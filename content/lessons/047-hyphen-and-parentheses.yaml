title: "Hyphen and parentheses"
teaches: ["-", "(", ")"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  The hyphen is to the right of the 0 key. The open parenthesis is Shift and 9. Punctuation belongs to the sentence. Type it without breaking your rhythm. Only the finger that reaches should move. The rest of your hand stays home. Punctuation is a normal key press. Say the mark to yourself as you type.
