title: "The apostrophe"
teaches: ["'"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  The apostrophe is to the right of the semicolon, under the right little finger. Punctuation belongs to the sentence. Type it without breaking your rhythm. A short pause and a shake of the hands every few minutes keeps them loose. Punctuation is a normal key press. Say the mark to yourself as you type.
