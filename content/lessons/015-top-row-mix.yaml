title: "Top row mix"
teaches: ["e", "i", "r", "u"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  E sits on the top row, above D. Reach up with your left middle finger and come straight back. I sits above K. Reach up with your right middle finger. Now use it inside real words. Keep your eyes on the screen, not your hands. Slow and even beats fast and jumpy.
