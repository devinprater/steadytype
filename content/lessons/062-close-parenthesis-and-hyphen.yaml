schema: 1
id: 62
unit: 8
ordinal: 62
title: "Close parenthesis and hyphen"
teaches: [")", "-"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  The close parenthesis is Shift and 0. The hyphen is to the right of the 0 key. Symbols mean Shift. Learn the pair, then use it in a line. Only the finger that reaches should move. The rest of your hand stays home. Symbols use Shift. Learn one pair at a time.
tasks:
  - text: "!! ?? !? ?!"
  - text: "@@ ## @# #@"
  - text: "$$ %% $% %$"
  - text: "^^ && ^& &^"
  - text: "* * ( ( ) )"
  - text: "))"
  - text: "--"
  - text: ")))"
