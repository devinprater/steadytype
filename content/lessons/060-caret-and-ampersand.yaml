intro: >-
  ^ uses Shift. Learn where it sits, then press it without looking down. & uses Shift. Learn where it sits, then press it without looking down. Symbols mean Shift. Learn the pair, then use it in a line. Slow and even beats fast and jumpy. Symbols use Shift. Learn one pair at a time.
