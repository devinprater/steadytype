title: "The letter P"
teaches: ["p"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  P is at the far right of the top row, above the semicolon. The right little finger reaches up. Press it, say its name in your head, and return to the home row. Only the finger that reaches should move. The rest of your hand stays home. The top row is a short reach. Do not lift the whole hand.
