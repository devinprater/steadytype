title: "Top row phrases"
teaches: ["e", "i", "r", "u"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  E sits on the top row, above D. Reach up with your left middle finger and come straight back. I sits above K. Reach up with your right middle finger. Two words at a time. Let the space bar carry you between them. If you miss a key, keep going. The next one matters more than the last.
