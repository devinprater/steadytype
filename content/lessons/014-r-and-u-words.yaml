title: "R and U words"
teaches: ["r", "u"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  R is above F. Your left index finger reaches up and slightly left. U is above J. Your right index finger reaches up and slightly left. Now use it inside real words. Keep your eyes on the screen, not your hands. A short pause and a shake of the hands every few minutes keeps them loose.
