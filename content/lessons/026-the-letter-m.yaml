title: "The letter M"
teaches: ["m"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  M is below J. Curl the right index finger down. Press it, say its name in your head, and return to the home row. If you miss a key, keep going. The next one matters more than the last. The bottom row curls your fingers down. Keep your wrists still.
