title: "The letter Q"
teaches: ["q"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  Q is at the far left of the top row, above A. The left little finger reaches up. Press it, say its name in your head, and return to the home row. If you miss a key, keep going. The next one matters more than the last. The top row is a short reach. Do not lift the whole hand.
