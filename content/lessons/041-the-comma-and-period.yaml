title: "The comma and period"
teaches: [",", "."]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  The comma is to the right of M. Press it with the right middle finger. The period is to the right of the comma. The right ring finger presses it. Punctuation belongs to the sentence. Type it without breaking your rhythm. If you miss a key, keep going. The next one matters more than the last.
