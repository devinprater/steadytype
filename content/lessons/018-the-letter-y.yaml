title: "The letter Y"
teaches: ["y"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  Y is above J and H. The right index finger moves up and left. Press it, say its name in your head, and return to the home row. Accuracy first. Speed arrives on its own. The top row is a short reach. Do not lift the whole hand.
