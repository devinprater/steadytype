title: "The letters G and H"
teaches: ["g", "h"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  G is on the home row between F and H. The left index finger slides right. H is between G and J. The right index finger slides left. Press it, say its name in your head, and return to the home row. Only the finger that reaches should move. The rest of your hand stays home.
