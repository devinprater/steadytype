title: "Colon and semicolon"
teaches: [":", ";"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  The colon is Shift and the semicolon. The semicolon is at the right end of the home row, under your right little finger. Punctuation belongs to the sentence. Type it without breaking your rhythm. If you miss a key, keep going. The next one matters more than the last.
