id: 64
unit: 8
ordinal: 64
title: "Brackets and slashes"
teaches: ["[", "]", "{", "}", "/", "|"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  [ uses Shift. Learn where it sits, then press it without looking down. ] uses Shift. Learn where it sits, then press it without looking down. Symbols mean Shift. Learn the pair, then use it in a line. A short pause and a shake of the hands every few minutes keeps them loose.
tasks:
  - text: "!! ?? !? ?!"
  - text: "@@ ## @# #@"
  - text: "$$ %% $% %$"
  - text: "^^ && ^& &^"
  - text: "* * ( ( ) )"
  - text: "_ _ = = + +"
  - text: "[ ] { } ( )"
  - text: "[["
