title: "The question mark"
teaches: ["?"]
kind: keyboarding
end_key: space
repeat: 4
intro: >-
  The question mark is Shift and the slash key, at the bottom right. Punctuation belongs to the sentence. Type it without breaking your rhythm. Only the finger that reaches should move. The rest of your hand stays home. Punctuation is a normal key press. Say the mark to yourself as you type.
