[project]
name = "steadytype-client"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "steadytype-engine",
  "wxPython==4.3.2",
]

[project.optional-dependencies]
speech = ["prismatoid>=0.18,<0.19"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
steadytype-client = "steadytype_client.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steadytype_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: needs a display; enabled with STEADYTYPE_UI=1"]
